[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nowcastpnn"
version = "0.0.1"
description = "A library for epidemiological nowcasting using Probabilistic Neural Networks."
authors = [
  { name="Silas Koemen", email="research@silaskoemen.com" },
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
# Declare that the dependencies list will be found elsewhere
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
# Tell setuptools to read dependencies from requirements.txt
dependencies = {file = ["requirements.txt"]}