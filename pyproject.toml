[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nowcastpnn"
version = "0.1.0"
description = "A library for epidemiological nowcasting using Probabilistic Neural Networks."
authors = [{ name = "Silas Koemen", email = "research@silaskoemen.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]
# This project's dependencies are managed by pixi, so this can be empty.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
