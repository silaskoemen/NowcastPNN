[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]


[dependencies]
# Core environment dependencies
python = "3.11.*"
pip = "*"


[pypi-dependencies]
bayesian-optimization = "*"
datasets = "==2.18.*"
hydra-core = "*"
ipykernel = "==6.*"
ipython = "==8.*"
isoduration = "==20.11.0"
joblib = "*"
keras = "==3.3.*"
loguru = "*"
matplotlib = "==3.7.*"
mlflow = "==3.2.*"
numpy = "==1.26.*"
omegaconf = "*"
pandas = "==2.2.*"
pre-commit = "==3.*"
scikit-learn = "==1.3.0"
scipy = "==1.11.*"
seaborn = "==0.12.*"

# PyPI-only packages
epiweeks = ">=2.0.0"
tensorflow = ">=2.16.0"
torch = "==2.4.0"
nowcastpnn = { path = ".", editable = true }


[tasks]
# The main setup task to install pre-commit hooks
setup = "pre-commit install"

# Task to run your training script
train = "python scripts/run_training.py"

# Task to start the MLflow UI
mlflow-ui = "mlflow ui"

# Task to run all pre-commit hooks manually
lint = "pre-commit run --all-files"
